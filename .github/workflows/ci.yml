name: Audit checks and release archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate and test
        run: python3 tools/check.py
      - name: Build allowlisted release archive
        run: python3 tools/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-xray-hev-beta
          path: |
            dist/os-xray-hev-*.tar.gz
            dist/SHA256SUMS
